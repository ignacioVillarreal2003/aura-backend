name: aura-auth-service CI

on:
  push:
    branches: [main]
    paths:
      - "aura-auth-service/**"
      - ".github/workflows/aura-auth-service.yml"
  pull_request:
    paths:
      - "aura-auth-service/**"
      - ".github/workflows/aura-auth-service.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: aura-auth-service

# django-auth-ldap (in requirements.txt) compiles python-ldap which needs
# OpenLDAP headers. All jobs share a common install step that apt-installs them
# before pip runs.
env:
  SECRET_KEY: ci-secret-key-not-for-production
  SERVICE_API_KEY: ci-service-api-key
  # Override the default port (5433) to match the GHA postgres service (5432).
  DB_PORT: "5432"
  DB_HOST: localhost
  DB_USER: aura_root
  DB_PASSWORD: aura_password
  DB_NAME: auth_db

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # No database service needed: unit tests mock the service and auth layers.
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenLDAP system headers
        run: sudo apt-get update -q && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-mock

      - name: Run unit tests
        run: python -m pytest tests/unitarios/ -q

  integracion-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura_root
          POSTGRES_PASSWORD: aura_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenLDAP system headers
        run: sudo apt-get update -q && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aura-auth-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-mock

      - name: Run integration tests
        # TEST.NAME = "test_auth_db" (set in settings/test.py).
        # pytest-django creates this DB on the postgres service using aura_root
        # (superuser) before running migrations. aura_db uses SQLite in-memory
        # (also set in settings/test.py) so no second postgres DB is needed.
        run: python -m pytest tests/integracion/ -q
