name: aura-document-processing-service CI

# Quality gate for aura-document-processing-service (monorepo-scoped).
# Path-filtered so it only runs when this service (or this workflow) changes.
#
# Scope: unit tests only. The lint (ruff), type-check (mypy), lockfile-resolve,
# dependency-audit (pip-audit) and docker-build jobs were intentionally removed;
# this workflow just runs the pytest suite.
on:
  push:
    branches: [main]
    paths:
      - "aura-document-processing-service/**"
      - ".github/workflows/aura-document-processing-service.yml"
  pull_request:
    paths:
      - "aura-document-processing-service/**"
      - ".github/workflows/aura-document-processing-service.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: aura-document-processing-service

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            aura-document-processing-service/requirements/base.txt
            aura-document-processing-service/requirements/requirements.txt
            aura-document-processing-service/requirements/requirements.test.txt

      - name: Install dependencies
        # Full runtime stack is installed for parity with the deploy image. The
        # heavy ML deps (torch+cpu, docling, sentence-transformers) are imported
        # lazily by the factories, so the mocked controller suite does not load any
        # model at runtime. The torch CPU wheel resolves via the --extra-index-url
        # pinned at the top of requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt -r requirements/requirements.test.txt

      - name: pytest
        # asyncio_mode=auto, testpaths=["test"], pythonpath and addopts come from
        # pyproject.toml. conftest.py seeds the one required env var and mocks the
        # DB/services, so no external Postgres/Redis/RabbitMQ/MinIO is contacted.
        #
        # Coverage floor is set below the current measured value (~70%) so the gate
        # catches regressions without flaking; ratchet it up as the service/repository
        # suites grow.
        run: |
          pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65
