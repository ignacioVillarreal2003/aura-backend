# Tooling configuration for aura-document-processing-service.
#
# This file does NOT declare a installable package; the service runs from the
# `app` package via uvicorn (see Dockerfile). It centralises the quality gate:
# ruff (lint), mypy (typing baseline) and pytest (async tests).

# ----------------------------------------------------------------------------
# Ruff — linting and import hygiene
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# High-signal rules are ENFORCED and currently green. Stylistic/modernisation
# rule sets ("I" import-order, "UP" pyupgrade) are intentionally left out of the
# enforced set for now: applying them touches ~580 files and would bury the
# meaningful diff during the in-progress refactor. They can be enabled and
# auto-applied (`ruff check --fix`) in a dedicated follow-up commit.
select = [
    "F",    # pyflakes — undefined names, unused imports, real bugs
    "E4", "E7", "E9",  # pycodestyle (import placement, statements, syntax)
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie — dead code / redundancy
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is advisory here, not a build failure
    "RUF001",  # ambiguous-unicode: Spanish content/messages are intentional
    "RUF003",  # ambiguous-unicode in comments (Spanish)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI deliberately uses callables as argument defaults (Depends/File/...).
# Whitelisting them removes the B008 false positives without disabling B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# Mypy — typing baseline (incremental; not strict everywhere yet)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app"]
# Heavy ML/LLM deps (torch, langchain, docling, sentence-transformers...) ship
# without complete stubs; silence those so mypy reports OUR types, not theirs.
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true

# ----------------------------------------------------------------------------
# Pytest — async test suite (replaces the missing pytest.ini)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra"
