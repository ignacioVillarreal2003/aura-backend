worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /auth/ {
            proxy_pass http://aura-auth-service:8000/;
        }

        location /chat/ {
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://aura-chat-service:8000/;
        }

        location /llm/ {
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://aura-llm-service:8000/;
        }

        location /processing/ {
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://aura-document-processing-service:8000/;
        }

        location /collections/ {
            proxy_pass http://aura-document-collection-service:8000/;
        }

        location /notifications/ {
            # SSE stream (/api/v1/notifications/stream/) needs an unbuffered,
            # long-lived connection; heartbeats keep it alive between events.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://aura-notification-service:8000/;
        }
    }
}
