services:
  aura-document-processing-service:
    build: ../aura-document-processing-service
    container_name: aura-document-processing-service
    ports:
      - "8000:8000"
    env_file:
      - ../aura-document-processing-service/.env.docker
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: on-failure
  
  aura-llm-service:
    build: ../aura-llm-service
    container_name: aura-llm-service
    ports:
      - "8001:8000"
    env_file:
      - ../aura-llm-service/.env.docker

  mock-auth:
    build: ../mock-auth
    container_name: mock-auth
    ports:
      - "8080:8000"

  db:
    build: ./db
    container_name: db
    environment:
      POSTGRES_USER: aura_root
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aura_root", "-d", "aura_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_db:
    build: ./auth-db
    container_name: auth_db
    environment:
      POSTGRES_USER: aura_root
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aura_root", "-d", "auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: storage
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: aura_root
      MINIO_ROOT_PASSWORD: aura_password
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  memory_db:
    image: redis:8.2
    container_name: memory_db
    ports:
      - "6379:6379"
    volumes:
      - memory_db_data:/data
    command: [ "redis-server", "--save", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  queue:
    image: rabbitmq:4.1-management
    container_name: queue
    environment:
      RABBITMQ_DEFAULT_USER: aura_root
      RABBITMQ_DEFAULT_PASS: aura_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - queue_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm:
    build: ./llm
    container_name: llm
    ports:
      - "11434:11434"
    volumes:
      - llm_data:/root/.ollama
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    environment:
      - strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - elasticsearch

volumes:
  db_data:
  auth_db_data:
  storage_data:
  memory_db_data:
  queue_data:
  llm_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data: