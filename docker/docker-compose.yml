services:
  aura-document-processing-service:
    build:
      context: ../aura-document-processing-service
      dockerfile: Dockerfile
    container_name: aura-document-processing-service
    ports:
      - "8000:8000"
    env_file:
      - ../aura-document-processing-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      storage:
        condition: service_healthy
      queue:
        condition: service_healthy
      llm:
        condition: service_healthy
    restart: on-failure

  aura-llm-service:
    build: ../aura-llm-service
    container_name: aura-llm-service
    ports:
      - "8001:8000"
    env_file:
      - ../aura-llm-service/.env.docker
    depends_on:
      llm:
        condition: service_healthy
    restart: on-failure
    
  aura-auth-service:
    build: ../aura-auth-service
    container_name: aura-auth-service
    ports:
      - "8002:8000"
    env_file:
      - ../aura-auth-service/.env.docker
    depends_on:
      auth_db:
        condition: service_healthy
      aura_db:
        condition: service_healthy
    restart: on-failure

  aura-chat-service:
    build: ../aura-chat-service
    container_name: aura-chat-service
    ports:
      - "8003:8000"
    env_file:
      - ../aura-chat-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      memory_db:
        condition: service_healthy
      aura-llm-service:
        condition: service_started
      mock-auth:
        condition: service_started
    restart: on-failure

  aura-notification-service:
    build: ../aura-notification-service
    container_name: aura-notification-service
    ports:
      - "8004:8000"
    env_file:
      - ../aura-notification-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      aura-auth-service:
        condition: service_started
    restart: on-failure

  aura-document-collection-service:
    build: ../aura-document-collection
    container_name: aura-document-collection-service
    ports:
      - "8005:8000"
    env_file:
      - ../aura-document-collection/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      mock-auth:
        condition: service_started
    restart: on-failure

  mock-auth:
    build: ../mock-auth
    container_name: mock-auth
    ports:
      - "8080:8000"

  aura_db:
    build: ./aura-db
    container_name: aura_db
    environment:
      POSTGRES_USER: aura_root
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_db
    volumes:
      - aura_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aura_root", "-d", "aura_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_db:
    build: ./auth-db
    container_name: auth_db
    environment:
      POSTGRES_USER: aura_root
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aura_root", "-d", "auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: storage
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: aura_root
      MINIO_ROOT_PASSWORD: aura_password
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  memory_db:
    image: redis:8.2
    container_name: memory_db
    ports:
      - "6379:6379"
    volumes:
      - memory_db_data:/data
    command: [ "redis-server", "--save", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  queue:
    image: rabbitmq:4.1-management
    container_name: queue
    environment:
      RABBITMQ_DEFAULT_USER: aura_root
      RABBITMQ_DEFAULT_PASS: aura_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - queue_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: llm
    volumes:
      - llm_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e -strict.perms=false
    depends_on:
      - elasticsearch
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    restart: unless-stopped

volumes:
  aura_db_data:
  auth_db_data:
  storage_data:
  memory_db_data:
  queue_data:
  llm_data:
  prometheus_data:
  elasticsearch_data:
  grafana_data: