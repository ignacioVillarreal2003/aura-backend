services:
  aura-document-processing-service:
    build:
      context: ../../aura-document-processing-service
      dockerfile: DockerfileGPU
    container_name: aura-document-processing-service
    ports:
      - "8000:8000"
    env_file:
      - ../../aura-document-processing-service/.env.docker.gpu
    depends_on:
      aura_db:
        condition: service_healthy
      storage:
        condition: service_healthy
      queue:
        condition: service_healthy
      llm:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: on-failure
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  aura-llm-service:
    build: ../../aura-llm-service
    container_name: aura-llm-service
    ports:
      - "8001:8000"
    env_file:
      - ../../aura-llm-service/.env.docker.gpu
    depends_on:
      llm:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  aura-auth-service:
    build: ../../aura-auth-service
    container_name: aura-auth-service
    ports:
      - "8002:8000"
    env_file:
      - ../../aura-auth-service/.env.docker
    depends_on:
      auth_db:
        condition: service_healthy
      aura_db:
        condition: service_healthy
    restart: on-failure

  aura-chat-service:
    build: ../../aura-chat-service
    container_name: aura-chat-service
    ports:
      - "8003:8000"
    env_file:
      - ../../aura-chat-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      memory_db:
        condition: service_healthy
      aura-llm-service:
        condition: service_started
      mock-auth:
        condition: service_started
    restart: on-failure

  aura-notification-service:
    build: ../../aura-notification-service
    container_name: aura-notification-service
    ports:
      - "8004:8000"
    env_file:
      - ../../aura-notification-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      aura-auth-service:
        condition: service_started
    restart: on-failure

  aura-document-collection-service:
    build: ../../aura-document-collection-service
    container_name: aura-document-collection-service
    ports:
      - "8005:8000"
    env_file:
      - ../../aura-document-collection-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      mock-auth:
        condition: service_started
    restart: on-failure

  mock-auth:
    build: ../../mock-auth
    container_name: mock-auth
    ports:
      - "8080:8000"

  llm:
    build:
      context: ../llm
      dockerfile: Dockerfile
    container_name: llm
    env_file:
      - ../../aura-llm-service/.env.docker.gpu
      - ../../aura-document-processing-service/.env.docker.gpu
    ports:
      - "11434:11434"
    volumes:
      - llm_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_GPU_OVERHEAD: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 30s

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/aura_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  llm_data:
  neo4j_data:
  neo4j_logs:
  huggingface_cache: