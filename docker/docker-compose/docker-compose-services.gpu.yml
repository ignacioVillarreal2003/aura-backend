services:
  aura-document-processing-service:
    build:
      context: ../../aura-document-processing-service
      dockerfile: DockerfileGPU
    container_name: aura-document-processing-service
    ports:
      - "8000:8000"
    env_file:
      - ../../aura-document-processing-service/.env.docker.gpu
    depends_on:
      aura_db:
        condition: service_healthy
      storage:
        condition: service_healthy
      queue:
        condition: service_healthy
      llm:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  aura-llm-service:
    build: ../../aura-llm-service
    container_name: aura-llm-service
    ports:
      - "8001:8000"
    env_file:
      - ../../aura-llm-service/.env.docker.gpu
    depends_on:
      llm:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  aura-chat-service:
    build: ../../aura-chat-service
    container_name: aura-chat-service
    ports:
      - "8003:8000"
    env_file:
      - ../../aura-chat-service/.env.docker
    depends_on:
      aura_db:
        condition: service_healthy
      memory_db:
        condition: service_healthy
      aura-llm-service:
        condition: service_started
      mock-auth:
        condition: service_started
    restart: on-failure

  mock-auth:
    build: ../../mock-auth
    container_name: mock-auth
    ports:
      - "8080:8000"

  llm:
    build:
      context: ../llm
      dockerfile: Dockerfile
    container_name: llm
    env_file:
      - ../../aura-llm-service/.env.docker.gpu
      - ../../aura-document-processing-service/.env.docker.gpu
    ports:
      - "11434:11434"
    volumes:
      - llm_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_GPU_OVERHEAD: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  llm_data: